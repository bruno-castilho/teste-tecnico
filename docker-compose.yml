services:
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: sensorweb
      POSTGRES_USER: sensorweb
      POSTGRES_PASSWORD: sensorweb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  generator:
    build: ./generator
    depends_on:
      - broker
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      PUBLISH_INTERVAL_SECONDS: "3"
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      - db
      - broker
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sensorweb
      DB_USER: sensorweb
      DB_PASSWORD: sensorweb
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
